<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Echoes of Memory</title>
  <desc id="d">A lone wanderer with a lantern walks a glowing path beneath a giant crystal tree, while fragments of forgotten memories float in a dreamy twilight sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070818"/>
      <stop offset="0.45" stop-color="#1d1447"/>
      <stop offset="0.8" stop-color="#6b2f74"/>
      <stop offset="1" stop-color="#ec7f7a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#ffe6b8"/>
      <stop offset="1" stop-color="#f2b982"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="canopy" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8ef0ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7c5cff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="canopyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#120a2a"/>
      <stop offset="0.7" stop-color="#2a1a4f"/>
      <stop offset="1" stop-color="#7fe8ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9b3" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffe9b3" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0fbff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#9b8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffc85c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c6d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7c6d0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f7c6d0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.4" opacity="0.9"/>
    <circle cx="150" cy="95" r="1" opacity="0.6"/>
    <circle cx="230" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="330" cy="75" r="0.9" opacity="0.5"/>
    <circle cx="420" cy="30" r="1.3" opacity="0.85"/>
    <circle cx="500" cy="62" r="0.8" opacity="0.6"/>
    <circle cx="710" cy="45" r="1.4" opacity="0.9"/>
    <circle cx="770" cy="120" r="1" opacity="0.6"/>
    <circle cx="40" cy="200" r="1" opacity="0.5"/>
    <circle cx="90" cy="250" r="0.9" opacity="0.45"/>
    <circle cx="745" cy="235" r="1.1" opacity="0.6"/>
    <circle cx="290" cy="150" r="0.8" opacity="0.5"/>
  </g>

  <!-- Moon -->
  <circle cx="600" cy="112" r="130" fill="url(#moonHalo)"/>
  <circle cx="600" cy="112" r="50" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="584" cy="100" r="8" fill="#f0d7a6" opacity="0.35"/>
  <circle cx="612" cy="126" r="5" fill="#f0d7a6" opacity="0.3"/>

  <!-- Far mountains -->
  <path d="M0 300 L80 238 L160 290 L250 208 L340 282 L430 228 L520 292 L610 218 L700 282 L800 236 L800 450 L0 450Z" fill="#3b2a6b" opacity="0.85"/>

  <!-- Mist between layers -->
  <rect x="0" y="262" width="800" height="70" fill="url(#fog)"/>

  <!-- Mid hills -->
  <path d="M0 340 Q150 290 300 335 T600 330 T800 318 L800 450 L0 450Z" fill="#221849"/>
  <path d="M0 380 Q200 350 400 378 T800 370 L800 450 L0 450Z" fill="#170f33"/>

  <!-- Giant memory tree -->
  <ellipse cx="200" cy="150" rx="170" ry="130" fill="url(#canopyGlow)"/>
  <path d="M196 380 Q204 300 194 250 Q186 210 200 170" fill="none" stroke="url(#trunk)" stroke-width="22" stroke-linecap="round"/>
  <path d="M196 260 Q160 230 130 210" fill="none" stroke="url(#trunk)" stroke-width="9" stroke-linecap="round"/>
  <path d="M198 240 Q240 205 270 190" fill="none" stroke="url(#trunk)" stroke-width="9" stroke-linecap="round"/>
  <path d="M200 190 Q190 160 160 140" fill="none" stroke="url(#trunk)" stroke-width="6" stroke-linecap="round"/>
  <path d="M200 180 Q220 150 250 132" fill="none" stroke="url(#trunk)" stroke-width="6" stroke-linecap="round"/>
  <g filter="url(#glow)" opacity="0.92">
    <circle cx="200" cy="150" r="62" fill="url(#canopy)"/>
    <circle cx="140" cy="175" r="48" fill="url(#canopy)"/>
    <circle cx="262" cy="170" r="52" fill="url(#canopy)"/>
    <circle cx="165" cy="115" r="40" fill="url(#canopy)"/>
    <circle cx="240" cy="108" r="44" fill="url(#canopy)"/>
    <circle cx="112" cy="222" r="26" fill="#f472b6" opacity="0.7"/>
    <circle cx="290" cy="222" r="22" fill="#8ef0ff" opacity="0.7"/>
  </g>
  <!-- Glowing crystal motes in canopy -->
  <g fill="#fff8d6" filter="url(#glow)">
    <circle cx="180" cy="128" r="2.2"/>
    <circle cx="230" cy="150" r="1.8"/>
    <circle cx="150" cy="165" r="2"/>
    <circle cx="265" cy="128" r="1.6"/>
    <circle cx="205" cy="92" r="1.8"/>
  </g>

  <!-- Glowing path -->
  <path d="M330 450 Q372 390 410 368 Q458 344 500 362" fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M330 450 Q372 390 410 368 Q458 344 500 362" fill="none" stroke="#fff3cf" stroke-width="2" stroke-dasharray="4 10" opacity="0.6"/>

  <!-- Wanderer with lantern -->
  <g>
    <ellipse cx="470" cy="402" rx="30" ry="6" fill="#000" opacity="0.35"/>
    <path d="M452 400 Q448 358 462 338 Q470 330 478 338 Q492 358 488 400 Z" fill="#0c0820"/>
    <path d="M462 338 Q470 330 478 338" fill="none" stroke="#7fe8ff" stroke-width="1" opacity="0.6"/>
    <path d="M466 320 Q470 306 474 320 L476 340 L464 340 Z" fill="#0c0820"/>
    <path d="M460 338 Q470 318 480 338 Q470 344 460 338Z" fill="#0c0820"/>
    <path d="M466 334 Q470 322 474 334" fill="none" stroke="#ffd27a" stroke-width="1" opacity="0.5"/>
    <path d="M478 360 Q498 352 504 336" fill="none" stroke="#0c0820" stroke-width="5" stroke-linecap="round"/>
    <line x1="504" y1="336" x2="504" y2="308" stroke="#3a2a22" stroke-width="2"/>
    <circle cx="504" cy="302" r="22" fill="url(#lantern)" filter="url(#glow)"/>
    <rect x="499" y="296" width="10" height="12" rx="2" fill="#ffe6a0" filter="url(#glow)"/>
  </g>

  <!-- Floating memory shards -->
  <g>
    <circle cx="330" cy="120" r="34" fill="#9b8cff" opacity="0.35" filter="url(#soft)"/>
    <g transform="translate(330 120) rotate(18)" filter="url(#glow)">
      <path d="M0 -26 L17 0 L0 26 L-17 0Z" fill="url(#shard)" stroke="#d8f7ff" stroke-opacity="0.8"/>
      <path d="M0 -10 L6 0 L0 10 L-6 0Z" fill="#ffffff" opacity="0.7"/>
    </g>

    <circle cx="530" cy="200" r="30" fill="#f472b6" opacity="0.3" filter="url(#soft)"/>
    <g transform="translate(530 200) rotate(-14)" filter="url(#glow)">
      <path d="M0 -22 L14 0 L0 22 L-14 0Z" fill="url(#shard)" stroke="#ffd6ec" stroke-opacity="0.8"/>
      <path d="M-4 -4 L4 -4 L4 4 L-4 4Z" fill="#ffffff" opacity="0.6"/>
    </g>

    <circle cx="700" cy="170" r="28" fill="#7ef0ff" opacity="0.3" filter="url(#soft)"/>
    <g transform="translate(700 170) rotate(30)" filter="url(#glow)">
      <path d="M0 -20 L13 0 L0 20 L-13 0Z" fill="url(#shard)" stroke="#c4f1ff" stroke-opacity="0.8"/>
    </g>

    <circle cx="640" cy="310" r="24" fill="#ffc85c" opacity="0.25" filter="url(#soft)"/>
    <g transform="translate(640 310) rotate(-8)" filter="url(#glow)">
      <path d="M0 -18 L11 0 L0 18 L-11 0Z" fill="url(#shard)" stroke="#fff0c2" stroke-opacity="0.8"/>
    </g>

    <circle cx="380" cy="262" r="20" fill="#7ef0ff" opacity="0.25" filter="url(#soft)"/>
    <g transform="translate(380 262) rotate(42)" filter="url(#glow)">
      <path d="M0 -14 L9 0 L0 14 L-9 0Z" fill="url(#shard)" stroke="#d8f7ff" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- Thin connecting threads of memory -->
  <g fill="none" stroke="#c4f1ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 6">
    <path d="M290 170 Q310 150 330 120"/>
    <path d="M360 120 Q430 90 530 200"/>
    <path d="M555 200 Q620 230 640 310"/>
  </g>

  <!-- Fireflies -->
  <g fill="#fff3a6" filter="url(#glow)">
    <circle cx="90" cy="330" r="2"/>
    <circle cx="120" cy="352" r="1.6"/>
    <circle cx="300" cy="310" r="1.8"/>
    <circle cx="560" cy="380" r="2"/>
    <circle cx="620" cy="360" r="1.6"/>
    <circle cx="700" cy="330" r="2"/>
    <circle cx="410" cy="410" r="1.6"/>
    <circle cx="250" cy="390" r="1.8"/>
  </g>

  <!-- Foreground vignette -->
  <rect width="800" height="450" fill="url(#sky)" opacity="0"/>
</svg>
