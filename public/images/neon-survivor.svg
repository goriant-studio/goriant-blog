<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- sky & floor -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040d"/>
      <stop offset="0.45" stop-color="#0d0825"/>
      <stop offset="0.6" stop-color="#2b0a3d"/>
      <stop offset="0.6" stop-color="#07051a"/>
      <stop offset="1" stop-color="#020208"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#8a2bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a2bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bossCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffe14d"/>
      <stop offset="0.6" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#3a0040"/>
    </radialGradient>
    <radialGradient id="bossAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ff2bd6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffe14d"/>
      <stop offset="0.65" stop-color="#ff6a00" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#0066ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="fireShot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#fff2a8"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8feff"/>
      <stop offset="0.5" stop-color="#3fd8ff"/>
      <stop offset="1" stop-color="#0a4a8a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9ff9ff"/>
      <stop offset="0.55" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="floorClip"><rect x="0" y="432" width="1280" height="288"/></clipPath>

    <!-- swarm drone -->
    <symbol id="drone" viewBox="-20 -20 40 40" overflow="visible">
      <polygon points="0,-16 14,0 0,16 -14,0" fill="#1a0322" stroke="#ff2bd6" stroke-width="2.5"/>
      <polygon points="0,-7 6,0 0,7 -6,0" fill="#ff7ae8"/>
      <line x1="-20" y1="0" x2="-14" y2="0" stroke="#ff2bd6" stroke-width="2"/>
      <line x1="14" y1="0" x2="20" y2="0" stroke="#ff2bd6" stroke-width="2"/>
    </symbol>
    <symbol id="crawler" viewBox="-20 -20 40 40" overflow="visible">
      <polygon points="-14,-12 14,0 -14,12 -8,0" fill="#1a0322" stroke="#b44dff" stroke-width="2.5"/>
      <circle cx="2" cy="0" r="3.5" fill="#e0b3ff"/>
    </symbol>
    <symbol id="spark" viewBox="-20 -20 40 40" overflow="visible">
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#fff6c2"/>
    </symbol>
    <symbol id="ship" viewBox="-40 -30 80 60" overflow="visible">
      <polygon points="-34,0 -60,-6 -60,6" fill="url(#flame)"/>
      <polygon points="34,0 -6,-10 -26,-26 -18,-6 -28,0 -18,6 -26,26 -6,10" fill="url(#hull)" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="18,0 2,-5 2,5" fill="#03040d"/>
      <circle cx="8" cy="0" r="2.5" fill="#00f3ff"/>
    </symbol>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.2" opacity="0.8"/><circle cx="140" cy="110" r="0.9" opacity="0.6"/>
    <circle cx="230" cy="55" r="1.4" opacity="0.9"/><circle cx="330" cy="140" r="0.8" opacity="0.5"/>
    <circle cx="420" cy="30" r="1.1" opacity="0.7"/><circle cx="505" cy="95" r="1.5" opacity="0.9"/>
    <circle cx="590" cy="20" r="0.9" opacity="0.6"/><circle cx="660" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="1010" cy="35" r="1.3" opacity="0.8"/><circle cx="1090" cy="95" r="0.9" opacity="0.6"/>
    <circle cx="1170" cy="45" r="1.5" opacity="0.9"/><circle cx="1240" cy="130" r="1" opacity="0.6"/>
    <circle cx="1210" cy="250" r="0.8" opacity="0.5"/><circle cx="40" cy="220" r="1.1" opacity="0.6"/>
    <circle cx="110" cy="300" r="0.8" opacity="0.5"/><circle cx="960" cy="180" r="0.9" opacity="0.5"/>
  </g>

  <!-- distant city skyline -->
  <g fill="#120526" stroke="#6a1b9a" stroke-width="1" opacity="0.95">
    <path d="M0 432 V380 H40 V350 H70 V395 H100 V330 H130 V300 H150 V330 H175 V390 H210 V360 H240 V410 H270 V370 H300 V340 H320 V400 H360 V432 Z"/>
    <path d="M920 432 V390 H950 V340 H980 V310 H1000 V350 H1030 V395 H1060 V360 H1090 V320 H1120 V290 H1135 V320 H1160 V380 H1190 V350 H1220 V400 H1250 V365 H1280 V432 Z"/>
  </g>
  <g fill="#00f3ff" opacity="0.7">
    <rect x="106" y="340" width="3" height="3"/><rect x="116" y="352" width="3" height="3"/>
    <rect x="136" y="310" width="3" height="3"/><rect x="280" y="380" width="3" height="3"/>
    <rect x="958" y="350" width="3" height="3"/><rect x="986" y="322" width="3" height="3"/>
    <rect x="1098" y="332" width="3" height="3"/><rect x="1126" y="300" width="3" height="3"/>
    <rect x="1198" y="362" width="3" height="3"/>
  </g>

  <!-- horizon glow -->
  <ellipse cx="760" cy="432" rx="700" ry="150" fill="url(#horizon)"/>

  <!-- ============ FLOOR GRID ============ -->
  <g clip-path="url(#floorClip)" stroke="#00f3ff" fill="none">
    <g stroke-width="1.5" opacity="0.55">
      <line x1="640" y1="432" x2="-1600" y2="720"/><line x1="640" y1="432" x2="-1120" y2="720"/>
      <line x1="640" y1="432" x2="-640" y2="720"/><line x1="640" y1="432" x2="-160" y2="720"/>
      <line x1="640" y1="432" x2="320" y2="720"/><line x1="640" y1="432" x2="640" y2="720"/>
      <line x1="640" y1="432" x2="960" y2="720"/><line x1="640" y1="432" x2="1440" y2="720"/>
      <line x1="640" y1="432" x2="1920" y2="720"/><line x1="640" y1="432" x2="2400" y2="720"/>
      <line x1="640" y1="432" x2="2880" y2="720"/>
    </g>
    <g stroke-width="1.5" opacity="0.5">
      <line x1="0" y1="438" x2="1280" y2="438"/><line x1="0" y1="447" x2="1280" y2="447"/>
      <line x1="0" y1="460" x2="1280" y2="460"/><line x1="0" y1="478" x2="1280" y2="478"/>
      <line x1="0" y1="503" x2="1280" y2="503"/><line x1="0" y1="537" x2="1280" y2="537"/>
      <line x1="0" y1="583" x2="1280" y2="583"/><line x1="0" y1="645" x2="1280" y2="645"/>
    </g>
  </g>
  <line x1="0" y1="432" x2="1280" y2="432" stroke="#ff7ae8" stroke-width="2" filter="url(#glow)"/>

  <!-- ============ BOSS ============ -->
  <circle cx="900" cy="250" r="260" fill="url(#bossAura)"/>
  <g transform="translate(900 250)">
    <!-- spikes -->
    <g fill="#1a0322" stroke="#ff2bd6" stroke-width="3" filter="url(#glow)">
      <polygon points="0,-185 18,-120 -18,-120"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(45)"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(90)"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(135)"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(180)"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(225)"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(270)"/>
      <polygon points="0,-185 18,-120 -18,-120" transform="rotate(315)"/>
    </g>
    <!-- armored rings -->
    <circle r="125" fill="#12021c" stroke="#ff2bd6" stroke-width="5" filter="url(#glow)"/>
    <circle r="108" fill="none" stroke="#b44dff" stroke-width="10" stroke-dasharray="46 14" opacity="0.9"/>
    <circle r="88" fill="none" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="4 8"/>
    <!-- eye -->
    <circle r="70" fill="url(#bossCore)" filter="url(#bigGlow)"/>
    <ellipse rx="14" ry="44" fill="#140010"/>
    <ellipse rx="4" ry="22" fill="#ff2bd6"/>
    <!-- weak point lock-on -->
    <g stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M-150 -110 h-30 v30"/><path d="M150 -110 h30 v30"/>
      <path d="M-150 110 h-30 v-30"/><path d="M150 110 h30 v-30"/>
    </g>
  </g>
  <!-- boss HP bar -->
  <g transform="translate(700 40)">
    <rect width="400" height="12" rx="6" fill="#1a0322" stroke="#ff2bd6" stroke-width="1.5"/>
    <rect x="2" y="2" width="240" height="8" rx="4" fill="#ff2bd6" filter="url(#glow)"/>
    <text x="0" y="-8" font-family="Arial Black, Arial, sans-serif" font-size="14" fill="#ff7ae8" letter-spacing="4">OVERMIND · CORE</text>
  </g>

  <!-- boss laser sweeping down -->
  <polygon points="860,330 940,330 720,720 520,720" fill="#ff2bd6" opacity="0.12"/>
  <line x1="900" y1="320" x2="640" y2="720" stroke="#ff7ae8" stroke-width="3" opacity="0.6" filter="url(#glow)"/>

  <!-- ============ SWARM ============ -->
  <g filter="url(#glow)">
    <use href="#drone" x="620" y="110" width="36" height="36"/>
    <use href="#drone" x="680" y="170" width="30" height="30"/>
    <use href="#drone" x="580" y="210" width="28" height="28"/>
    <use href="#drone" x="1100" y="120" width="34" height="34"/>
    <use href="#drone" x="1160" y="200" width="30" height="30"/>
    <use href="#drone" x="1210" y="300" width="36" height="36"/>
    <use href="#drone" x="1130" y="400" width="30" height="30"/>
    <use href="#drone" x="640" y="380" width="34" height="34"/>
    <use href="#drone" x="720" y="460" width="40" height="40"/>
    <use href="#drone" x="840" y="520" width="44" height="44"/>
    <use href="#drone" x="1000" y="480" width="40" height="40"/>
    <use href="#drone" x="1120" y="550" width="46" height="46"/>
    <use href="#crawler" x="560" y="300" width="30" height="30"/>
    <use href="#crawler" x="760" y="560" width="40" height="40"/>
    <use href="#crawler" x="960" y="590" width="44" height="44"/>
    <use href="#crawler" x="1200" y="470" width="36" height="36"/>
    <use href="#crawler" x="1060" y="420" width="30" height="30"/>
    <use href="#crawler" x="700" y="270" width="28" height="28"/>
  </g>

  <!-- ============ HEROES + LASER TETHER ============ -->
  <!-- tether triangle (glow layer + white core) -->
  <g stroke-linecap="round">
    <polyline points="210,250 380,400 200,540 210,250" fill="#00f3ff" fill-opacity="0.07" stroke="#00f3ff" stroke-width="10" opacity="0.35" filter="url(#bigGlow)"/>
    <polyline points="210,250 380,400 200,540 210,250" fill="none" stroke="#00f3ff" stroke-width="5" filter="url(#glow)"/>
    <polyline points="210,250 380,400 200,540 210,250" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <!-- swarm units sliced by the tether -->
  <g filter="url(#glow)">
    <use href="#spark" x="275" y="310" width="34" height="34"/>
    <use href="#spark" x="186" y="380" width="28" height="28"/>
    <use href="#spark" x="280" y="460" width="30" height="30"/>
  </g>

  <!-- hero halos -->
  <circle cx="380" cy="400" r="90" fill="url(#cyanHalo)"/>
  <circle cx="210" cy="250" r="55" fill="url(#cyanHalo)"/>
  <circle cx="200" cy="540" r="55" fill="url(#cyanHalo)"/>

  <!-- ships -->
  <g filter="url(#glow)">
    <use href="#ship" x="300" y="340" width="160" height="120"/>
    <use href="#ship" x="155" y="208" width="110" height="84"/>
    <use href="#ship" x="145" y="498" width="110" height="84"/>
  </g>
  <!-- AI wingman tag -->
  <g font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#9ff9ff">
    <text x="170" y="200">AI WINGMAN</text>
    <text x="165" y="600">PLAYER 2</text>
    <text x="345" y="350" fill="#ffffff" font-weight="bold">P1</text>
  </g>

  <!-- ============ ELEMENTAL FIRE ============ -->
  <!-- cyan pulse shots -->
  <g stroke-linecap="round" filter="url(#glow)">
    <line x1="440" y1="400" x2="560" y2="380" stroke="url(#shot)" stroke-width="5"/>
    <line x1="470" y1="410" x2="600" y2="402" stroke="url(#shot)" stroke-width="5"/>
    <line x1="450" y1="390" x2="590" y2="340" stroke="url(#shot)" stroke-width="5"/>
    <line x1="290" y1="250" x2="420" y2="220" stroke="url(#shot)" stroke-width="4"/>
    <line x1="280" y1="540" x2="420" y2="560" stroke="url(#shot)" stroke-width="4"/>
  </g>
  <!-- fire stream -->
  <g stroke-linecap="round" filter="url(#glow)">
    <line x1="460" y1="420" x2="700" y2="470" stroke="url(#fireShot)" stroke-width="9"/>
    <line x1="470" y1="430" x2="800" y2="530" stroke="url(#fireShot)" stroke-width="7"/>
  </g>
  <!-- lightning chain -->
  <polyline points="455,395 520,350 505,320 590,290 575,262 650,230 640,205 700,185"
            fill="none" stroke="#fff6a8" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="455,395 520,350 505,320 590,290 575,262 650,230 640,205 700,185"
            fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- ice shards -->
  <g fill="#c9f6ff" stroke="#7ad7ff" stroke-width="1.5" filter="url(#glow)">
    <polygon points="520,440 540,446 520,452 512,446"/>
    <polygon points="560,460 582,466 560,472 552,466"/>
    <polygon points="610,445 630,451 610,457 602,451"/>
  </g>

  <!-- explosions -->
  <circle cx="720" cy="480" r="42" fill="url(#blast)"/>
  <circle cx="820" cy="540" r="54" fill="url(#blast)"/>
  <circle cx="705" cy="185" r="30" fill="url(#blast)"/>
  <circle cx="600" cy="385" r="26" fill="url(#blast)"/>
  <g filter="url(#glow)">
    <use href="#spark" x="800" y="520" width="40" height="40"/>
    <use href="#spark" x="705" y="465" width="30" height="30"/>
  </g>

  <!-- debris particles -->
  <g fill="#ffe14d" filter="url(#soft)">
    <circle cx="760" cy="505" r="3"/><circle cx="870" cy="505" r="2.5"/><circle cx="845" cy="590" r="3"/>
    <circle cx="690" cy="510" r="2"/><circle cx="740" cy="160" r="2.5"/><circle cx="670" cy="170" r="2"/>
  </g>
  <g fill="#00f3ff" filter="url(#soft)">
    <circle cx="330" cy="300" r="2.5"/><circle cx="240" cy="430" r="2"/><circle cx="310" cy="500" r="2.5"/>
  </g>

  <!-- XP orbs -->
  <g fill="#7dff9a" filter="url(#glow)">
    <circle cx="520" cy="560" r="5"/><circle cx="560" cy="600" r="4"/><circle cx="480" cy="620" r="5"/>
    <circle cx="610" cy="580" r="4"/>
  </g>

  <!-- ============ HUD ============ -->
  <g font-family="Arial Black, Arial, sans-serif" letter-spacing="3">
    <text x="40" y="54" font-size="14" fill="#9ff9ff">WAVE 27</text>
    <text x="40" y="82" font-size="26" fill="#ffffff" filter="url(#glow)">x148 COMBO</text>
    <rect x="40" y="96" width="220" height="6" rx="3" fill="#0a2a3a"/>
    <rect x="40" y="96" width="160" height="6" rx="3" fill="#00f3ff" filter="url(#glow)"/>
  </g>

  <!-- vignette -->
  <rect width="1280" height="720" fill="url(#vignette)"/>

  <!-- ============ TITLE ============ -->
  <rect x="240" y="676" width="800" height="2" fill="url(#titleBar)"/>
  <g font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="640" y="652" font-size="96" letter-spacing="8" fill="#00f3ff" opacity="0.6" filter="url(#bigGlow)">NEON SURVIVOR</text>
    <text x="640" y="652" font-size="96" letter-spacing="8" fill="url(#title)" stroke="#ffffff" stroke-width="1.5">NEON SURVIVOR</text>
    <text x="640" y="704" font-size="20" letter-spacing="10" fill="#ff7ae8" filter="url(#glow)">NEON PROTOCOL: SWARM</text>
  </g>
</svg>
